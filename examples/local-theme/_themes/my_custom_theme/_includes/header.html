
<header>
    <nav>
        <a href="{{ page.lang.url }}">Home</a>
        {% for cat in site.categories %}
            {% if page.lang.url == "/" %}
                | <a href="/{{ cat.key }}">{{ cat.value.label }}</a>
            {% else %}
                | <a href="{{ page.lang.url }}/{{ cat.key }}">{{ cat.value.label }}</a>
            {% endif %}
        {% endfor %}
    </nav>
</header>
